<section class="coming-soon-page">
  <!-- Header -->
  <header class="page-header">
    <button class="back-btn" type="button" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="back-icon">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <div class="header-copy">
      <p class="header-eyebrow">What's Next</p>
      <h1 class="header-title">Coming Soon</h1>
    </div>
  </header>

  <p class="page-subtitle">Tap a feature to see what's coming your way.</p>

  <!-- 2×3 icon grid — each card expands on tap to show full description -->
  <div class="features-grid">
    @for (feature of features; track feature.id) {
    <button type="button"
            class="feature-card"
            [class.feature-card--expanded]="feature.expanded"
            (click)="toggleFeature(feature)">
      <div class="feature-card__icon">
        @switch (feature.icon) {
          @case ('users') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          }
          @case ('chart') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          }
          @case ('watch') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="12" x2="15" y2="14"/></svg>
          }
          @case ('alert') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          }
          @case ('heart') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          }
          @case ('globe') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          }
        }
      </div>
      <span class="feature-card__title">{{ feature.title }}</span>

      <!-- Expanded panel — spans full width via CSS grid trick -->
      @if (feature.expanded) {
      <div class="feature-card__panel">
        <p class="feature-card__desc">{{ feature.description }}</p>
        <span class="coming-soon-badge">Coming Soon</span>
      </div>
      }
    </button>
    }
  </div>

  <!-- Notify Me CTA -->
  <div class="notify-section">
    <p class="notify-copy">Be the first to know when new features go live.</p>
    <button
      class="notify-btn"
      type="button"
      [class.notify-btn--done]="notifySubmitted"
      [disabled]="notifySubmitted || notifyLoading"
      (click)="notifyMe()">
      @if (notifyLoading) {
        Saving...
      } @else if (notifySubmitted) {
        You're on the list ✓
      } @else {
        Notify me when features launch
      }
    </button>
  </div>

  <app-bottom-nav [tabs]="PATIENT_TABS" activeTab="home"></app-bottom-nav>
</section>
