<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Typographic Connection -->
  <g transform="translate(20, 55)">
    <!-- Bold "HEALTH" -->
    <text x="0" y="0" font-family="'Roboto', sans-serif" font-weight="900" font-size="26" fill="#064e3b">HEALTH</text>
    <!-- Light "HUB" in Rust Orange -->
    <text x="115" y="0" font-family="'Roboto', sans-serif" font-weight="300" font-size="26" fill="#ea580c">HUB</text>
    <!-- Connecting Line / Hub element -->
