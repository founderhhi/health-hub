<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Icon: Clinical Cross with a Hub Node -->
  <g transform="translate(20, 25)">
    <!-- Cross -->
    <path d="M20 0 h10 v20 h20 v10 h-20 v20 h-10 v-20 h-20 v-10 h20 z" fill="#064e3b" /> <!-- Deep Green -->
    <!-- Node -->
    <circle cx="45" cy="5" r="8" fill="#10b981" /> <!-- Emerald Green -->
  </g>
  
  <!-- Text -->
  <text x="85" y="50" font-family="'Roboto', sans-serif" font-weight="700" font-size="28" fill="#064e3b">Health Hub</text>
  <text x="86" y="70" font-family="'Roboto', sans-serif" font-weight="300" font-size="14" letter-spacing="4" fill="#64748b">INTERNATIONAL</text>
</svg>
