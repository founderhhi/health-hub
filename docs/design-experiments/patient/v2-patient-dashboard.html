<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Hub | Patient Dashboard V2 (Clinical Kinetic Light)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300..600,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#006e22",
                        "primary-container": "#e6f8ea",
                        "secondary": "#9b4600",
                        "secondary-container": "#fff0e6",
                        "surface": "#f4f6fa",
                        "card": "#ffffff",
                        "text-main": "#0d1c2e",
                        "text-dim": "#5c6b7d",
                        "border-color": "#e2e8f0"
                    },
                    fontFamily: {
                        "headline": ["Outfit", "sans-serif"],
                        "body": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        "kinetic": "0 10px 30px -5px rgba(0, 110, 34, 0.1)",
                        "sharp": "0 4px 0px 0px rgba(0, 110, 34, 0.1)"
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        .kinetic-card {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            box-shadow: 0 4px 0px 0px #e2e8f0;
            transition: all 0.2s ease;
        }
        .kinetic-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px 0px rgba(0, 110, 34, 0.2);
            border-color: rgba(0, 110, 34, 0.3);
        }
        .kinetic-button {
            border: 1.5px solid transparent;
            transition: all 0.2s;
        }
        .kinetic-button:hover {
            border-color: #006e22;
            background: #e6f8ea;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="bg-surface text-text-main font-body antialiased relative min-h-screen pb-24 selection:bg-primary-container selection:text-primary">
    <!-- Subtle Grid Background -->
    <div class="fixed inset-0 pointer-events-none opacity-5 z-0" style="background-image: linear-gradient(#006e22 1px, transparent 1px), linear-gradient(90deg, #006e22 1px, transparent 1px); background-size: 40px 40px;"></div>

    <div class="max-w-md mx-auto relative z-10 p-5 pt-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <img src="https://i.pravatar.cc/150?img=11" alt="Profile" class="w-14 h-14 rounded-[1rem] border-2 border-primary/20 object-cover shadow-sm" />
                <div>
                    <h1 class="font-headline text-3xl font-black tracking-tight text-text-main m-0 leading-none">Anuraag</h1>
                    <p class="text-xs font-bold text-primary tracking-widest uppercase mt-1">Health Dashboard</p>
                </div>
            </div>
            <div class="relative group cursor-pointer">
                <div class="w-12 h-12 rounded-[1rem] kinetic-card flex items-center justify-center text-text-dim hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">notifications</span>
                </div>
                <span class="absolute top-2 right-2 w-3 h-3 bg-secondary rounded-full border-2 border-white"></span>
            </div>
        </header>

        <!-- Stats Block -->
        <section class="mb-10 w-full flex gap-4">
            <div class="flex-1 kinetic-card rounded-[1.5rem] p-5 flex flex-col justify-between cursor-pointer">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-black uppercase text-text-dim tracking-widest">Consults</span>
                    <span class="material-symbols-outlined text-primary text-xl bg-primary-container p-1 rounded-lg">video_camera_front</span>
                </div>
                <div class="flex items-end gap-2">
                    <h2 class="font-headline text-4xl font-black text-text-main leading-none">4</h2>
                    <span class="text-xs font-bold text-primary mb-1">Upcoming</span>
                </div>
            </div>
            
            <div class="flex-1 kinetic-card rounded-[1.5rem] p-5 flex flex-col justify-between cursor-pointer">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-black uppercase text-text-dim tracking-widest">Rx Active</span>
                    <span class="material-symbols-outlined text-secondary text-xl bg-secondary-container p-1 rounded-lg">pill</span>
                </div>
                <div class="flex items-end gap-2">
                    <h2 class="font-headline text-4xl font-black text-text-main leading-none">2</h2>
                    <span class="text-xs font-bold text-secondary mb-1">Scripts</span>
                </div>
            </div>
        </section>

        <!-- Services 3x3 Grid -->
        <section class="mb-12">
            <div class="flex justify-between items-end mb-4">
                <h2 class="font-headline font-black text-xl text-text-main tracking-tight">Services</h2>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-primary group-hover:scale-110 transition-transform">monitor_heart</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Pulse</span>
                </button>
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-primary group-hover:scale-110 transition-transform">videocam</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Video</span>
                </button>
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-primary group-hover:scale-110 transition-transform">stethoscope</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Doctor</span>
                </button>
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-secondary group-hover:scale-110 transition-transform">local_pharmacy</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Pharmacy</span>
                </button>
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-[#4b6700] group-hover:scale-110 transition-transform">science</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Labs</span>
                </button>
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-text-dim group-hover:text-primary group-hover:scale-110 transition-transform">public</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Global</span>
                </button>
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-text-dim group-hover:text-primary group-hover:scale-110 transition-transform">shield_with_heart</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Shield</span>
                </button>
                <button class="bg-card rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 kinetic-button shadow-sm border-border-color group">
                    <span class="material-symbols-outlined text-[32px] text-text-dim group-hover:text-primary group-hover:scale-110 transition-transform">self_improvement</span>
                    <span class="text-[11px] font-bold text-text-main uppercase tracking-wider">Home</span>
                </button>
                <button class="bg-surface rounded-[1.25rem] aspect-square flex flex-col items-center justify-center gap-3 border-2 border-dashed border-border-color hover:border-primary transition-colors group">
                    <span class="material-symbols-outlined text-[32px] text-text-dim group-hover:text-primary transition-transform">apps</span>
                    <span class="text-[11px] font-bold text-text-dim group-hover:text-primary uppercase tracking-wider">More</span>
                </button>
            </div>
        </section>

        <!-- Records Quick Access -->
        <section class="mb-10">
            <button class="w-full kinetic-card rounded-[1.5rem] p-6 flex items-center justify-between group">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-[1rem] bg-primary text-white flex items-center justify-center shadow-kinetic group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-3xl">folder_managed</span>
                    </div>
                    <div class="text-left">
                        <h3 class="font-headline font-black text-xl text-text-main leading-tight">Health Records</h3>
                        <p class="text-sm text-text-dim font-medium mt-1">View prescriptions & results</p>
                    </div>
                </div>
                <span class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </button>
        </section>

        <!-- Recent Prescriptions -->
        <section class="mb-6">
            <h2 class="font-headline font-black text-lg text-text-main mb-4 uppercase tracking-widest text-xs">Recent Prescriptions</h2>
            <div class="flex flex-col gap-4">
                <div class="bg-card border-1.5 border-border-color rounded-[1.25rem] p-4 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-[1rem] bg-primary-container text-primary flex items-center justify-center text-sm font-black">
                            RX
                        </div>
                        <div>
                            <span class="block font-black text-text-main text-lg tracking-tight">#RX-83492</span>
                            <span class="text-[11px] text-text-dim font-bold uppercase tracking-widest mt-0.5">3 items &bull; Today</span>
                        </div>
                    </div>
                    <span class="px-3 py-1.5 bg-primary-container text-primary text-[10px] font-black uppercase tracking-widest rounded-[0.5rem]">Active</span>
                </div>
            </div>
        </section>

    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 w-full bg-card border-t-2 border-border-color pb-safe pt-2 px-6 z-50 rounded-t-[2rem]">
        <div class="flex justify-between items-center max-w-md mx-auto h-20">
            <button class="flex flex-col items-center gap-1.5 text-primary">
                <span class="material-symbols-outlined icon-fill text-3xl">home</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 text-text-dim hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-3xl">calendar_today</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">Visits</span>
            </button>
            <div class="relative -top-6">
                <button class="w-16 h-16 bg-primary text-white rounded-[1.25rem] shadow-kinetic flex items-center justify-center hover:-translate-y-1 active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-4xl">add</span>
                </button>
            </div>
            <button class="flex flex-col items-center gap-1.5 text-text-dim hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-3xl">chat</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">Chat</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 text-text-dim hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-3xl">person</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">Profile</span>
            </button>
        </div>
    </nav>

    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
