<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Hub | Patient Dashboard V1</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300..600,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#006e22", 
                        "on-primary": "#ffffff",
                        "secondary": "#9b4600",
                        "surface": "#f4f6fa",
                        "surface-glass": "rgba(255, 255, 255, 0.75)"
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        "glass": "0 8px 32px 0 rgba(31, 38, 135, 0.07)",
                        "premium": "0 10px 40px -10px rgba(0, 110, 34, 0.15)"
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-surface text-slate-900 font-body antialiased relative min-h-screen pb-24">
    <!-- Texture Overlay for "Depth" -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.03] z-0" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');"></div>
    <!-- Subtle Top Wash -->
    <div class="fixed top-0 left-0 w-full h-[600px] bg-gradient-to-b from-[#006e22]/10 via-[#006e22]/5 to-transparent -z-10 pointer-events-none"></div>

    <div class="max-w-md mx-auto relative z-10 p-5 pt-8">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <p class="text-sm font-semibold text-slate-500 mb-1">Good morning,</p>
                <h1 class="font-headline text-3xl font-black tracking-tight text-slate-800">Anuraag</h1>
            </div>
            <div class="flex gap-3">
                <button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-slate-600 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">light_mode</span>
                </button>
                <div class="relative">
                    <button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-slate-600 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <span class="absolute top-0 right-0 w-3 h-3 bg-secondary rounded-full border-2 border-surface"></span>
                </div>
            </div>
        </header>

        <!-- Stats (Horizontal Scroll) -->
        <section class="mb-10 w-full overflow-x-auto pb-4 -mx-5 px-5 snap-x hide-scrollbar">
            <div class="flex gap-4 min-w-max">
                <div class="glass-panel w-36 h-32 rounded-[2rem] p-5 flex flex-col justify-between hover:-translate-y-1 transition-transform cursor-pointer snap-start">
                    <div class="w-10 h-10 rounded-xl bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined">video_camera_front</span>
                    </div>
                    <div>
                        <span class="block text-2xl font-black font-headline tracking-tighter text-slate-800">4</span>
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Consults</span>
                    </div>
                </div>
                
                <div class="glass-panel w-36 h-32 rounded-[2rem] p-5 flex flex-col justify-between hover:-translate-y-1 transition-transform cursor-pointer snap-start">
                    <div class="w-10 h-10 rounded-xl bg-secondary/10 text-secondary flex items-center justify-center">
                        <span class="material-symbols-outlined">pill</span>
                    </div>
                    <div>
                        <span class="block text-2xl font-black font-headline tracking-tighter text-slate-800">2</span>
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Scripts</span>
                    </div>
                </div>

                <div class="glass-panel w-36 h-32 rounded-[2rem] p-5 flex flex-col justify-between hover:-translate-y-1 transition-transform cursor-pointer snap-start">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center">
                        <span class="material-symbols-outlined">science</span>
                    </div>
                    <div>
                        <span class="block text-2xl font-black font-headline tracking-tighter text-slate-800">1</span>
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Lab Orders</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Services 3x3 Grid -->
        <section class="mb-10">
            <h2 class="font-headline font-black text-xl mb-4 text-slate-800">Services</h2>
            <div class="grid grid-cols-3 gap-3">
                <!-- Service 1 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-primary drop-shadow-sm group-hover:scale-110 transition-transform">monitor_heart</span>
                    <span class="text-[11px] font-bold text-slate-700">Pulse</span>
                </button>
                <!-- Service 2 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-primary drop-shadow-sm group-hover:scale-110 transition-transform">videocam</span>
                    <span class="text-[11px] font-bold text-slate-700">Video</span>
                </button>
                <!-- Service 3 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-primary drop-shadow-sm group-hover:scale-110 transition-transform">stethoscope</span>
                    <span class="text-[11px] font-bold text-slate-700">Doctor</span>
                </button>
                <!-- Service 4 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-primary drop-shadow-sm group-hover:scale-110 transition-transform">local_pharmacy</span>
                    <span class="text-[11px] font-bold text-slate-700">Pharmacy</span>
                </button>
                <!-- Service 5 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-primary drop-shadow-sm group-hover:scale-110 transition-transform">science</span>
                    <span class="text-[11px] font-bold text-slate-700">Labs</span>
                </button>
                <!-- Service 6 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-secondary/10 hover:border-secondary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-secondary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-secondary drop-shadow-sm group-hover:scale-110 transition-transform">public</span>
                    <span class="text-[11px] font-bold text-slate-700">Global</span>
                </button>
                <!-- Service 7 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-[#4b6700] drop-shadow-sm group-hover:scale-110 transition-transform">shield_with_heart</span>
                    <span class="text-[11px] font-bold text-slate-700">Insurance</span>
                </button>
                <!-- Service 8 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-primary drop-shadow-sm group-hover:scale-110 transition-transform">self_improvement</span>
                    <span class="text-[11px] font-bold text-slate-700">Home Care</span>
                </button>
                <!-- Service 9 -->
                <button class="bg-white rounded-3xl aspect-square flex flex-col items-center justify-center gap-3 shadow-premium border border-primary/10 hover:border-primary/50 transition-colors group relative overflow-hidden opacity-70">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
                    <span class="material-symbols-outlined text-3xl text-slate-400 drop-shadow-sm group-hover:scale-110 transition-transform">add</span>
                    <span class="text-[11px] font-bold text-slate-500">More</span>
                </button>
            </div>
        </section>

        <!-- Records Quick Access -->
        <section class="mb-10">
            <button class="w-full glass-panel rounded-3xl p-5 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-white shadow-sm flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined">folder_managed</span>
                    </div>
                    <div class="text-left">
                        <h3 class="font-headline font-black text-lg text-slate-800 leading-tight">Health Records</h3>
                        <p class="text-sm text-slate-500 font-medium">View prescriptions & results</p>
                    </div>
                </div>
                <span class="material-symbols-outlined text-slate-400 group-hover:translate-x-1 transition-transform">arrow_forward_ios</span>
            </button>
        </section>

        <!-- Recent Prescriptions -->
        <section class="mb-6">
            <div class="flex justify-between items-end mb-4">
                <h2 class="font-headline font-black text-xl text-slate-800">Recent Prescriptions</h2>
                <button class="text-sm font-bold text-primary hover:underline">View all</button>
            </div>
            <div class="flex flex-col gap-3">
                <div class="glass-panel rounded-2xl p-4 flex justify-between items-center bg-white/40">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-[#e3fee6] text-primary flex items-center justify-center text-sm font-black">
                            RX
                        </div>
                        <div>
                            <span class="block font-bold text-slate-800">#RX-83492</span>
                            <span class="text-xs text-slate-500 font-medium">3 items &bull; Today</span>
                        </div>
                    </div>
                    <span class="px-3 py-1 bg-[#e3fee6] text-primary text-[10px] font-black uppercase rounded-full">Active</span>
                </div>
                
                <div class="glass-panel rounded-2xl p-4 flex justify-between items-center bg-white/40">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center text-sm font-black">
                            RX
                        </div>
                        <div>
                            <span class="block font-bold text-slate-800">#RX-44812</span>
                            <span class="text-xs text-slate-500 font-medium">1 item &bull; Mar 12</span>
                        </div>
                    </div>
                    <span class="px-3 py-1 bg-slate-100 text-slate-500 text-[10px] font-black uppercase rounded-full">Completed</span>
                </div>
            </div>
        </section>

    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 w-full glass-panel border-t border-white/40 pb-safe pt-2 px-6 z-50 rounded-t-[2rem]">
        <div class="flex justify-between items-center max-w-md mx-auto h-16">
            <button class="flex flex-col items-center gap-1 text-primary">
                <span class="material-symbols-outlined icon-fill">home</span>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
                <span class="material-symbols-outlined">calendar_today</span>
                <span class="text-[10px] font-bold">Visits</span>
            </button>
            <div class="relative -top-5">
                <button class="w-14 h-14 bg-primary text-white rounded-full shadow-[0_8px_20px_rgba(0,110,34,0.3)] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-3xl">add</span>
                </button>
            </div>
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
                <span class="material-symbols-outlined">chat</span>
                <span class="text-[10px] font-bold">Messages</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
                <span class="material-symbols-outlined">person</span>
                <span class="text-[10px] font-bold">Profile</span>
            </button>
        </div>
    </nav>

    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
